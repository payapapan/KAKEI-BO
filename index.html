<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#edefea">
<title>ゆる家計簿</title>
<style>
:root{
  --paper:#edefea;
  --card:#fbfcfa;
  --ink:#17212b;
  --sumi:#5e6b73;
  --line:#d7dcd6;
  --ai:#2a4d7a;
  --ai-soft:#e3e9f1;
  --enji:#9b3b4a;
  --koke:#6b7f4e;
  --r:14px;
  --tab:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{height:100%}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  height:100vh;height:100dvh;
  display:flex;flex-direction:column;overflow:hidden;
}
#stage{flex:1;min-height:0}
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}

/* ---- top bar ---- */
.top{
  flex:0 0 auto;z-index:20;
  background:var(--paper);
  border-bottom:1px solid var(--line);
  padding:7px 14px;
  padding-top:calc(7px + env(safe-area-inset-top));
  display:flex;align-items:center;gap:10px;
}
.mnav{display:flex;align-items:center;gap:2px}
.mnav button{
  background:none;border:0;padding:6px 8px;border-radius:8px;
  color:var(--sumi);font-size:17px;line-height:1;cursor:pointer;
}
.mnav button:active{background:var(--ai-soft)}
.month{font-size:16px;font-weight:600;letter-spacing:.02em;min-width:5.5em;text-align:center}
.top .sum{margin-left:auto;text-align:right;line-height:1.25}
.top .sum b{font-size:19px;font-weight:600;letter-spacing:-.01em}
.top .sum span{display:block;font-size:11px;color:var(--sumi)}
.gear{background:none;border:0;padding:6px;font-size:19px;cursor:pointer;opacity:.6}

/* ---- views ---- */
.view{display:none;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px}
.view.on{display:block}
#v-input.on{
  display:flex;flex-direction:column;gap:8px;
  overflow:hidden;padding:8px 12px 10px;
}

/* ---- amount display (hero) ---- */
.amt{
  flex:0 0 auto;
  padding:6px 2px 8px;
  border-bottom:2px solid var(--ink);
  display:flex;align-items:baseline;gap:6px;
}
.amt .yen{font-size:20px;color:var(--sumi);font-weight:400}
.amt .v{
  flex:1;text-align:right;
  font-size:46px;font-weight:300;letter-spacing:-.02em;line-height:1.1;
}
.amt.zero .v{color:#b3bcb4}
.amt.income{border-bottom-color:var(--koke)}
.amt.income .v{color:var(--koke)}
.amt.bump .v{animation:bump .18s ease-out}
@keyframes bump{from{transform:translateY(3px);opacity:.5}to{transform:none;opacity:1}}

/* 支出／収入の小トグル（金額行の左端） */
.tog{display:flex;gap:3px;align-self:center}
.tog button{
  padding:4px 9px;border-radius:999px;border:1px solid var(--line);
  background:transparent;color:var(--sumi);cursor:pointer;font-size:12px;line-height:1.3;
}
.tog button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

.seg{display:flex;gap:6px;margin:14px 0 4px}
.seg button{
  flex:1;padding:7px 0;border-radius:999px;border:1px solid var(--line);
  background:transparent;color:var(--sumi);cursor:pointer;font-size:13px;
}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

/* ---- categories ---- */
.cats{flex:0 0 auto;display:flex;gap:5px}
.cat{
  flex:1;min-width:0;
  border:1px solid var(--line);background:var(--card);border-radius:11px;
  padding:6px 1px 5px;text-align:center;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;
}
.cat em{font-style:normal;font-size:17px;line-height:1}
.cat span{
  font-size:10px;color:var(--sumi);letter-spacing:-.04em;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:clip;max-width:100%;
}
.cat[aria-pressed="true"]{background:var(--ai-soft);border-color:var(--ai)}
.cat[aria-pressed="true"] span{color:var(--ai);font-weight:600}
.cat.more em{font-size:15px}

/* 全分類シート */
.allcats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.allcats .cat{padding:11px 2px 9px}
.allcats .cat em{font-size:21px}
.allcats .cat span{font-size:11px}

/* ---- date row ---- */
.drow{flex:0 0 auto;display:flex;gap:5px;align-items:center}
.drow button{
  padding:6px 11px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);cursor:pointer;font-size:12px;color:var(--sumi);white-space:nowrap;
}
.drow button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.drow input[type=date]{
  flex:1;min-width:0;padding:6px 8px;border-radius:9px;font-size:13px;
  border:1px solid var(--line);background:var(--card);
}
.memo{
  width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);margin-top:4px;
}
.memo::placeholder{color:#9aa69c}

/* ---- keypad ---- */
.pad{
  flex:1 1 auto;min-height:150px;
  display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:6px;
}
.pad button{
  padding:0;border-radius:12px;border:1px solid var(--line);
  background:var(--card);font-size:24px;font-weight:400;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.pad button:active{background:var(--ai-soft)}
.pad .fn{font-size:17px;color:var(--sumi)}
.pad #kSave{
  grid-column:4;grid-row:2 / 5;
  background:var(--ink);border-color:var(--ink);color:#fff;
  font-size:17px;font-weight:600;writing-mode:vertical-rl;letter-spacing:.35em;text-indent:.35em;
}
.pad #kSave:disabled{background:#c3cac4;border-color:#c3cac4}
.save{
  width:100%;margin-top:10px;padding:16px;border-radius:12px;border:0;
  background:var(--ink);color:#fff;font-size:16px;font-weight:600;cursor:pointer;
}
.save:disabled{background:#c3cac4;color:#fff}

/* ---- ledger list ---- */
.daygrp{margin-bottom:16px}
.dayhd{
  display:flex;justify-content:space-between;align-items:baseline;
  font-size:12px;color:var(--sumi);padding:0 2px 5px;border-bottom:1px solid var(--line);
}
.row{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:11px 2px;background:none;border:0;border-bottom:1px solid rgba(215,220,214,.55);
  text-align:left;cursor:pointer;
}
.row em{font-style:normal;font-size:18px;width:24px;text-align:center;flex:0 0 auto}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t span{font-size:11px;color:var(--sumi)}
.row .p{font-size:16px;font-weight:500;letter-spacing:-.01em}
.row .p.in{color:var(--koke)}
.empty{text-align:center;color:var(--sumi);padding:44px 20px;font-size:14px}

/* ---- summary ---- */
.big{padding:6px 0 14px;border-bottom:2px solid var(--ink)}
.big .k{font-size:12px;color:var(--sumi)}
.big .v{font-size:40px;font-weight:300;letter-spacing:-.02em;line-height:1.15}
.duo{display:flex;gap:18px;margin:12px 0 18px}
.duo div{flex:1}
.duo .k{font-size:11px;color:var(--sumi)}
.duo .v{font-size:19px;font-weight:500}
.bar{height:9px;border-radius:5px;background:#dde2dc;overflow:hidden;margin:7px 0 3px}
.bar i{display:block;height:100%;background:var(--ai);border-radius:5px}
.bar i.over{background:var(--enji)}
.cbar{margin:13px 0}
.cbar .l{display:flex;justify-content:space-between;font-size:13px}
.cbar .l span{color:var(--sumi);font-size:12px}
.cbar .t{height:7px;border-radius:4px;background:#dde2dc;overflow:hidden;margin-top:5px}
.cbar .t i{display:block;height:100%;background:var(--ai);opacity:.85}
.note{font-size:13px;color:var(--sumi);margin-top:6px}

/* ---- receipt ---- */
.drop{
  border:1.5px dashed #b9c2ba;border-radius:var(--r);background:var(--card);
  padding:30px 18px;text-align:center;cursor:pointer;
}
.drop b{display:block;font-size:16px;margin-bottom:5px}
.drop span{font-size:13px;color:var(--sumi)}
.howto{margin:14px 0 12px;padding-left:1.4em;font-size:13px;color:var(--sumi);line-height:1.8}
.howto li{padding-left:3px}
.howto b{color:var(--ink);font-weight:600}
.paste{
  width:100%;min-height:148px;padding:12px;border:1px solid var(--line);
  border-radius:var(--r);background:var(--card);resize:vertical;
  font-size:14px;line-height:1.55;
}
.paste::placeholder{color:#9aa69c}
.rcard{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:13px;margin-top:11px;
}
.rcard .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:9px}
.rcard .hd b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rcard .f{display:flex;gap:7px;margin-bottom:8px}
.rcard input,.rcard select{
  padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;min-width:0;
}
.rcard input.a{flex:1;font-size:17px;font-weight:500;text-align:right}
.rcard select{flex:1}
.rcard .items{font-size:12px;color:var(--sumi);max-height:82px;overflow:auto;margin-bottom:9px}
.rcard .items div{display:flex;justify-content:space-between;gap:8px;padding:1px 0}
.rcard .act{display:flex;gap:7px}
.rcard .act button{flex:1;padding:11px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer}
.rcard .act button.ok{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
.flag{font-size:11px;color:var(--enji);margin-bottom:7px}
.busy{display:flex;align-items:center;gap:9px;color:var(--sumi);font-size:13px;padding:14px 2px}
.spin{width:15px;height:15px;border:2px solid var(--line);border-top-color:var(--ai);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---- tab bar ---- */
.tabs{
  flex:0 0 auto;z-index:30;
  padding-bottom:env(safe-area-inset-bottom);
  background:var(--card);
  border-top:1px solid var(--line);display:flex;
}
.tabs button{
  flex:1;background:none;border:0;cursor:pointer;color:var(--sumi);height:var(--tab);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;
}
.tabs button em{font-style:normal;font-size:19px;line-height:1;opacity:.75}
.tabs button[aria-pressed="true"]{color:var(--ai);font-weight:600}
.tabs button[aria-pressed="true"] em{opacity:1}

/* ---- toast / sheet ---- */
.toast{
  position:fixed;left:50%;bottom:calc(var(--tab) + 16px + env(safe-area-inset-bottom));
  transform:translate(-50%,14px);z-index:60;
  background:var(--ink);color:#fff;border-radius:999px;
  padding:10px 16px;font-size:13px;display:flex;align-items:center;gap:12px;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;
  max-width:92vw;
}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:none;border:0;color:#9fc0ea;font-weight:600;cursor:pointer;padding:0}
.scrim{position:fixed;inset:0;background:rgba(23,33,43,.34);z-index:70;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:80;
  background:var(--paper);border-radius:18px 18px 0 0;
  padding:16px 16px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .22s ease-out;
  max-height:88vh;overflow:auto;
}
.sheet.on{transform:none}
.sheet h2{font-size:16px;margin:0 0 12px}
.sheet label{display:block;font-size:12px;color:var(--sumi);margin:12px 0 4px}
.sheet input,.sheet select{
  width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;
}
.sheet .btns{display:flex;gap:8px;margin-top:16px}
.sheet .btns button{flex:1;padding:13px;border-radius:11px;border:1px solid var(--line);background:#fff;cursor:pointer}
.sheet .btns button.ok{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
.sheet .btns button.del{color:var(--enji);border-color:#e3c8cd}
.mini{width:100%;padding:12px;margin-top:8px;border:1px solid var(--line);border-radius:11px;background:#fff;cursor:pointer;text-align:left}
.hint{font-size:11px;color:var(--sumi);margin-top:5px;line-height:1.5}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="top">
  <div class="mnav">
    <button id="prevM" aria-label="前の月">‹</button>
    <div class="month num" id="monthLbl">2026年9月</div>
    <button id="nextM" aria-label="次の月">›</button>
  </div>
  <div class="sum"><b class="num" id="topSum">¥0</b><span id="topLbl">今月の支出</span></div>
  <button class="gear" id="openSet" aria-label="設定">⚙</button>
</div>

<main id="stage">

<!-- 入力 -->
<section class="view on" id="v-input">
  <div class="amt zero" id="amtBox">
    <div class="tog">
      <button id="tExp" aria-pressed="true">支出</button>
      <button id="tInc" aria-pressed="false">収入</button>
    </div>
    <span class="yen">¥</span><span class="v num" id="amtVal">0</span>
  </div>
  <div class="cats" id="catGrid"></div>
  <div class="drow">
    <button id="dToday" aria-pressed="true">今日</button>
    <button id="dYest" aria-pressed="false">昨日</button>
    <input type="date" id="dPick">
    <button id="memoBtn" aria-pressed="false">メモ</button>
  </div>
  <input class="memo" id="memo" placeholder="お店やメモ" hidden>
  <div class="pad" id="pad"></div>
</section>

<!-- レシート -->
<section class="view" id="v-receipt">
  <div class="seg">
    <button id="mPaste" aria-pressed="true">文字を貼り付け</button>
    <button id="mPhoto" aria-pressed="false">写真から</button>
  </div>

  <div id="paneP">
    <ol class="howto">
      <li>レシートを写真に撮ります。</li>
      <li>写真アプリで開き、右下の<b>文字マーク</b>を押します。</li>
      <li>文字を長押しして<b>すべてを選択</b>、<b>コピー</b>します。</li>
      <li>下の欄に貼り付けて、読み取るを押します。</li>
    </ol>
    <textarea class="paste" id="pasteBox" placeholder="ここにレシートの文字を貼り付けてください"></textarea>
    <button class="save" id="pasteGo">読み取る</button>
    <div class="hint">文字の読み取りはiPhoneの中だけで行われます。写真も文字もこの端末から出ません。</div>
  </div>

  <div id="paneF" hidden>
    <div class="drop" id="drop">
      <b>レシートを撮る／選ぶ</b>
      <span>金額・日付・お店・分類を読み取ります。<br>まとめて何枚でも選べます。</span>
    </div>
    <input type="file" id="file" accept="image/*" multiple hidden>
    <div class="hint">こちらは写真をAnthropicのAPIに送って読み取ります。通信が必要です。</div>
  </div>

  <div id="rBusy"></div>
  <div id="rList"></div>
</section>

<!-- 記録 -->
<section class="view" id="v-list"><div id="listBody"></div></section>

<!-- 集計 -->
<section class="view" id="v-chart"><div id="chartBody"></div></section>

</main>

<nav class="tabs">
  <button data-v="input" aria-pressed="true"><em>⌨</em>入力</button>
  <button data-v="receipt" aria-pressed="false"><em>🧾</em>レシート</button>
  <button data-v="list" aria-pressed="false"><em>📖</em>記録</button>
  <button data-v="chart" aria-pressed="false"><em>📊</em>集計</button>
</nav>

<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastAct" hidden>取り消す</button></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>

<script>
"use strict";

/* ========== 定数 ========== */
const EXP = [
  ["food","食費","🍚"],["eatout","外食","🍜"],["daily","日用品","🧴"],["traffic","交通","🚃"],
  ["health","医療","💊"],["cloth","衣料","👕"],["fun","趣味","🎮"],["social","交際","🎁"],
  ["util","光熱費","💡"],["tel","通信","📶"],["home","住居","🏠"],["etc","その他","📦"]
];
const INC = [["salary","給与","💴"],["bonus","賞与","🎊"],["other_in","その他","🪙"]];
const CATMAP = {};
EXP.concat(INC).forEach(c => CATMAP[c[0]] = {name:c[1], emoji:c[2]});
const KEY = "yuru-kakeibo:v1";

/* ========== 保存先（Claude内でもPi等の自前ホストでも動く） ========== */
const store = {
  async get(){
    if (window.storage) {
      try { const r = await window.storage.get(KEY); if (r && r.value) return JSON.parse(r.value); } catch(e){}
    }
    try { const v = localStorage.getItem(KEY); if (v) return JSON.parse(v); } catch(e){}
    return null;
  },
  async set(data){
    const s = JSON.stringify(data);
    if (window.storage) {
      try { await window.storage.set(KEY, s); return; } catch(e){}
    }
    try { localStorage.setItem(KEY, s); } catch(e){}
  }
};

/* ========== 状態 ========== */
let DB = { entries: [], budget: 0, apiKey: "", lastCat: "food" };
let view = "input";
let cur = new Date(); cur.setDate(1);
let input = { amount: "", type: "exp", cat: "food", date: todayStr(), memo: "" };
let undo = null, toastT = null;

/* ========== 小道具 ========== */
function todayStr(d){ const t = d || new Date(); return [t.getFullYear(), String(t.getMonth()+1).padStart(2,"0"), String(t.getDate()).padStart(2,"0")].join("-"); }
function yen(n){ return "¥" + Math.round(n).toLocaleString("ja-JP"); }
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function monthKey(d){ return d.slice(0,7); }
function curKey(){ return cur.getFullYear() + "-" + String(cur.getMonth()+1).padStart(2,"0"); }
function ofMonth(k){ return DB.entries.filter(e => monthKey(e.date) === k); }
function sumBy(list, type){ return list.filter(e => e.type === type).reduce((s,e) => s + e.amount, 0); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function toast(msg, undoFn){
  $("toastMsg").textContent = msg;
  const b = $("toastAct");
  b.hidden = !undoFn;
  b.onclick = () => { if (undoFn) undoFn(); hideToast(); };
  $("toast").classList.add("on");
  clearTimeout(toastT);
  toastT = setTimeout(hideToast, undoFn ? 4800 : 2000);
}
function hideToast(){ $("toast").classList.remove("on"); }

async function save(){ await store.set(DB); renderAll(); }

/* ========== 入力画面 ========== */
let catOrder = null;
function usageOrder(){
  const cnt = {};
  DB.entries.forEach(e => { if (e.type === "exp") cnt[e.cat] = (cnt[e.cat] || 0) + 1; });
  const base = EXP.map(c => c[0]);
  return base.slice().sort((a,b) => (cnt[b]||0) - (cnt[a]||0) || base.indexOf(a) - base.indexOf(b));
}
function chip(k){
  const m = CATMAP[k] || { name:"その他", emoji:"📦" };
  return `<button class="cat" data-c="${k}" aria-pressed="${input.cat===k}"><em>${m.emoji}</em><span>${m.name}</span></button>`;
}
function renderCats(){
  if (input.type === "inc"){
    $("catGrid").innerHTML = INC.map(c => chip(c[0])).join("");
    return;
  }
  if (!catOrder) catOrder = usageOrder();
  const row = catOrder.slice(0, 5);
  if (row.indexOf(input.cat) < 0) row[4] = input.cat;
  $("catGrid").innerHTML = row.map(chip).join("")
    + '<button class="cat more" data-c="__more"><em>⋯</em><span>ほか</span></button>';
}
function openAllCats(){
  openSheet('<h2>分類を選ぶ</h2><div class="allcats" id="allCats">'
    + EXP.map(c => chip(c[0])).join("")
    + '</div><div class="btns"><button id="acClose">閉じる</button></div>');
  $("acClose").onclick = closeSheet;
  $("allCats").addEventListener("click", ev => {
    const b = ev.target.closest(".cat"); if (!b) return;
    input.cat = b.dataset.c; closeSheet(); renderCats();
  });
}
function renderAmt(bump){
  const box = $("amtBox");
  const n = Number(input.amount || 0);

function renderChart(){
  const k = curKey();
  const list = ofMonth(k);
  const exp = sumBy(list, "exp"), inc = sumBy(list, "inc");
  const pd = new Date(cur); pd.setMonth(pd.getMonth() - 1);
  const prev = sumBy(ofMonth(pd.getFullYear() + "-" + String(pd.getMonth()+1).padStart(2,"0")), "exp");
  const diff = exp - prev;

  const byCat = {};
  list.filter(e => e.type === "exp").forEach(e => { byCat[e.cat] = (byCat[e.cat] || 0) + e.amount; });
  const cats = Object.keys(byCat).map(c => [c, byCat[c]]).sort((a,b) => b[1] - a[1]);
  const top = cats.length ? cats[0][1] : 1;

  let html = `<div class="big"><div class="k">${cur.getMonth()+1}月の支出</div><div class="v num">${yen(exp)}</div></div>
  <div class="duo">
    <div><div class="k">収入</div><div class="v num">${yen(inc)}</div></div>
    <div><div class="k">差引</div><div class="v num" style="color:${inc-exp<0?"var(--enji)":"var(--koke)"}">${inc-exp<0?"−":"+"}${yen(Math.abs(inc-exp))}</div></div>
  </div>`;

  if (DB.budget > 0){
    const p = Math.min(100, exp / DB.budget * 100);
    const over = exp > DB.budget;
    html += `<div class="bar"><i class="${over?"over":""}" style="width:${p}%"></i></div>
      <div class="note num">予算 ${yen(DB.budget)} のうち ${Math.round(exp/DB.budget*100)}％。${
        over ? "超えています。" : "残り " + yen(DB.budget - exp) + "。"}</div>`;
  }

  if (prev > 0) html += `<div class="note num">先月（${pd.getMonth()+1}月）の支出は ${yen(prev)}。${
    diff === 0 ? "同じです。" : (diff > 0 ? yen(diff) + " 多く使っています。" : yen(-diff) + " 少なく済んでいます。")}</div>`;

  if (cats.length){
    html += '<div style="margin-top:22px">' + cats.map(([c,v]) => {
      const m = CATMAP[c] || {name:"その他", emoji:"📦"};
      return `<div class="cbar">
        <div class="l"><span>${m.emoji} ${m.name}</span><b class="num">${yen(v)}<span class="num" style="margin-left:6px">${Math.round(v/exp*100)}％</span></b></div>
        <div class="t"><i style="width:${v/top*100}%"></i></div>
      </div>`;
    }).join("") + "</div>";
  } else {
    html += '<div class="empty">この月の支出はまだありません。</div>';
  }
  $("chartBody").innerHTML = html;
}

let pending = [];

async function shrink(file){
  const url = URL.createObjectURL(file);
  const img = await new Promise((res, rej) => {
    const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url;
  });
  const max = 1500;
  const sc = Math.min(1, max / Math.max(img.width, img.height));
  const cv = document.createElement("canvas");
  cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
  cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
  URL.revokeObjectURL(url);
  return cv.toDataURL("image/jpeg", 0.82).split(",")[1];
}

const PROMPT = `このレシート画像を読み取り、JSONのみを返してください。前置き・説明・コードフェンスは一切書かないでください。
{"store":"店名(不明ならnull)","date":"YYYY-MM-DD(不明ならnull)","total":支払合計の整数(不明ならnull),"cat":"分類キー","items":[{"name":"品名","price":整数}],"confidence":"high|medium|low"}
分類キーは次から1つ選ぶ: food(スーパー・食料品) eatout(飲食店・カフェ) daily(ドラッグストア・日用品) traffic(交通) health(病院・薬) cloth(衣料) fun(趣味・書籍・娯楽) social(贈答) util(電気ガス水道) tel(通信) home(家賃・住宅) etc(その他)
totalは割引・ポイント適用後の実際の支払額。itemsは最大15件、なければ空配列。`;

async function readReceipt(b64){
  const headers = { "Content-Type": "application/json" };
  const body = {
    model: "claude-sonnet-4-6",
    max_tokens: 1000,
    messages: [{ role: "user", content: [
      { type: "image", source: { type: "base64", media_type: "image/jpeg", data: b64 } },
      { type: "text", text: PROMPT }
    ]}]
  };
  if (DB.apiKey){
    headers["x-api-key"] = DB.apiKey;
    headers["anthropic-version"] = "2023-06-01";
    headers["anthropic-dangerous-direct-browser-access"] = "true";
  }
  const r = await fetch("https://api.anthropic.com/v1/messages", { method: "POST", headers, body: JSON.stringify(body) });
  if (!r.ok) throw new Error("status " + r.status);
  const d = await r.json();
  const txt = (d.content || []).map(c => c.type === "text" ? c.text : "").join("");
  const s = txt.indexOf("{"), e = txt.lastIndexOf("}");
  if (s < 0 || e < 0) throw new Error("parse");
  return JSON.parse(txt.slice(s, e + 1));
}

async function handleFiles(files){
  const imgs = files.filter(f => f.type.startsWith("image/"));

const FKD = "ガギグゲゴザジズゼゾダヂヅデドバビブベボパピプペポヴ".split("");
const HK1 = "ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜｦﾝｧｨｩｪｫｯｬｭｮｰ｡｢｣､･";

function z2h(s){
  let t = s;
  HKD.forEach((h, i) => { t = t.split(h).join(FKD[i]); });
  t = t.replace(/[\uFF61-\uFF9F]/g, c => { const i = HK1.indexOf(c); return i < 0 ? c : FK1[i]; });
  return t.replace(/[０-９Ａ-Ｚａ-ｚ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
          .replace(/￥/g, "¥").replace(/，/g, ",").replace(/．/g, ".")
          .replace(/：/g, ":").replace(/／/g, "/").replace(/　/g, " ");
}
function nums(line){
  const m = line.match(/\d{1,3}(?:,\d{3})+|\d+/g) || [];
  return m.map(x => Number(x.replace(/,/g, ""))).filter(n => !isNaN(n));
}
function fmtDate(y, m, d){
  y = Number(y); m = Number(m); d = Number(d);
  if (m < 1 || m > 12 || d < 1 || d > 31) return null;
  return y + "-" + String(m).padStart(2,"0") + "-" + String(d).padStart(2,"0");
}

function parseReceiptText(raw){
  const text = z2h(raw);
  const lines = text.split(/\r?\n/).map(s => s.trim()).filter(s => s.length);

  // --- 日付 ---
  let date = null;
  let m = text.match(/(20\d{2})\s*[年\/\-\.]\s*(\d{1,2})\s*[月\/\-\.]\s*(\d{1,2})/);
  if (m) date = fmtDate(m[1], m[2], m[3]);
  if (!date){
    m = text.match(/[令R]\s*和?\s*(\d{1,2})\s*[年\/\-\.]\s*(\d{1,2})\s*[月\/\-\.]\s*(\d{1,2})/);
    if (m) date = fmtDate(2018 + Number(m[1]), m[2], m[3]);
  }
  if (!date){
    m = text.match(/(?:^|[^\d])(\d{1,2})\s*[\/月\-]\s*(\d{1,2})\s*日?(?:[^\d]|$)/);
    if (m){
      const y = new Date().getFullYear();
      date = fmtDate(y, m[1], m[2]);
      if (date && date > todayStr()) date = fmtDate(y - 1, m[1], m[2]);
    }
  }

  // --- 合計金額 ---
  const NEG = /(預り|預か|お預|釣|つり|ポイント|値引|割引|クーポン|残高|前回|累計|還元)/;
  const KEYS = [
    [/(お支払|支払合計|お会計|ご請求|請求額|現計)/, 3],
    [/(合\s*計|税込合計|総額|お買上|買上計)/, 2],
    [/(小\s*計)/, 1]
  ];
  let best = null;
  lines.forEach((ln, i) => {
    if (NEG.test(ln)) return;
    for (const [re, w] of KEYS){
      if (!re.test(ln)) continue;
      let cand = nums(ln).filter(n => n > 0 && n < 10000000);
      if (!cand.length && lines[i+1]) cand = nums(lines[i+1]).filter(n => n > 0 && n < 10000000);
      if (!cand.length) continue;
      const v = Math.max.apply(null, cand);
      if (!best || w > best.w || (w === best.w && i > best.i)) best = { v: v, w: w, i: i };
    }
  });
  let total = best ? best.v : 0, low = !best;
  if (!total){
    const all = [];
    lines.forEach(ln => { if (!NEG.test(ln)) nums(ln).forEach(n => { if (n > 0 && n < 1000000) all.push(n); }); });
    if (all.length) total = Math.max.apply(null, all);
    low = true;
  }

  // --- 店名 ---
  const BAD = /(領収|レシート|明細|控|TEL|電話|FAX|〒|http|登録番号|インボイス|T\d{10,}|\d{2,4}-\d{2,4}-\d{4}|[都道府県].{0,12}[市区郡])/i;
  let store = "";
  for (let i = 0; i < Math.min(7, lines.length); i++){
    const l = lines[i];
    if (BAD.test(l)) continue;
    if (/^[\d\s\-\/:¥,\.\*#]+$/.test(l)) continue;
    if (l.length < 2 || l.length > 28) continue;
    store = l.replace(/^(株式会社|有限会社|\(株\)|㈱)\s*/, "").trim();
    break;
  }

  // --- 明細 ---
  const items = [];
  const SKIP = /(合\s*計|小\s*計|支払|預り|お預|釣|ポイント|消費税|対象|点数|枚数|税込|税抜|領収|TEL|登録番号|現金|クレジット|カード|電子マネー|チャージ|残高|\d{1,2}:\d{2}|20\d{2}年|[年月日]\s*$|No\.)/;
  for (const ln of lines){
    if (SKIP.test(ln)) continue;
    const mm = ln.match(/^(.{2,22}?)\s*[¥\\]?\s*(\d{1,3}(?:,\d{3})+|\d{2,6})\s*[\*※外内]?$/);
    if (!mm) continue;
    const price = Number(mm[2].replace(/,/g, ""));
    if (!(price > 0 && price < 200000)) continue;
    if (!/[^\d\s,\.\-\/]/.test(mm[1])) continue;
    items.push({ name: mm[1].trim(), price: price });
    if (items.length >= 15) break;
  }

  return { store: store, date: date, total: total, cat: guessCat(store, text), items: items, low: low };
}

$("pasteGo").onclick = () => {
  const raw = $("pasteBox").value;
  if (!raw.trim()){ toast("レシートの文字を貼り付けてください"); return; }
  const j = parseReceiptText(raw);
  pending.unshift({
    id: uid(),
    store: j.store,
    date: j.date || todayStr(),
    amount: j.total || 0,
    cat: j.cat,
    items: j.items,
    low: j.low
  });
  $("pasteBox").value = "";
  renderPending();
  if (j.low) toast("金額を確認してください");
};

/* ========== シート（編集・設定） ========== */
function openSheet(html){
  $("sheet").innerHTML = html;
  $("sheet").classList.add("on"); $("scrim").classList.add("on");
}
function closeSheet(){ $("sheet").classList.remove("on"); $("scrim").classList.remove("on"); }
$("scrim").onclick = closeSheet;

function openEdit(id){
  const e = DB.entries.find(x => x.id === id); if (!e) return;
  const list = e.type === "inc" ? INC : EXP;
  openSheet(`<h2>記録を直す</h2>
    <label for="eA">金額</label><input id="eA" type="number" inputmode="numeric" value="${e.amount}">
    <label for="eC">分類</label><select id="eC">${list.map(c => `<option value="${c[0]}" ${c[0]===e.cat?"selected":""}>${c[2]} ${c[1]}</option>`).join("")}</select>
    <label for="eD">日付</label><input id="eD" type="date" value="${e.date}">
    <label for="eM">メモ</label><input id="eM" value="${esc(e.memo || "")}">
    ${e.detail ? `<label>レシートの明細</label><div class="hint" style="white-space:pre-line">${esc(e.detail)}</div>` : ""}
    <div class="btns"><button class="del" id="eDel">削除</button><button id="eCancel">やめる</button><button class="ok" id="eSave">保存</button></div>`);
  $("eCancel").onclick = closeSheet;
  $("eSave").onclick = async () => {
    const a = Number($("eA").value || 0); if (a <= 0) return;
    e.amount = Math.round(a); e.cat = $("eC").value; e.date = $("eD").value || e.date; e.memo = $("eM").value.trim();
    closeSheet(); await save(); toast("保存しました");
  };
  $("eDel").onclick = async () => {
    const backup = Object.assign({}, e);
    DB.entries = DB.entries.filter(x => x.id !== id);
    closeSheet(); await save();
    toast("削除しました", async () => { DB.entries.push(backup); await save(); toast("戻しました"); });
  };
}

$("openSet").onclick = () => {
  openSheet(`<h2>設定</h2>
    <label for="sB">1か月の予算（使わないなら空欄）</label>
    <input id="sB" type="number" inputmode="numeric" value="${DB.budget || ""}" placeholder="例 120000">
    <label for="sK">Anthropic APIキー（任意）</label>
    <input id="sK" type="password" value="${esc(DB.apiKey || "")}" placeholder="sk-ant-...">
    <div class="hint">Claudeのアプリ内で使う場合は空欄のままで読み取れます。ご自分のサーバーに置いて使うときだけ、ここにキーを入れてください。キーはこの端末にだけ保存されます。</div>
    <button class="mini" id="sCsv">CSVで書き出す（Excel用）</button>
    <button class="mini" id="sJson">バックアップを書き出す</button>
    <button class="mini" id="sImp">バックアップから読み込む</button>
    <input type="file" id="sFile" accept="application/json" hidden>
    <button class="mini" id="sClr" style="color:var(--enji)">すべての記録を消す</button>
    <div class="btns"><button id="sCancel">閉じる</button><button class="ok" id="sSave">保存</button></div>`);
  $("sCancel").onclick = closeSheet;
  $("sSave").onclick = async () => {
    DB.budget = Number($("sB").value || 0);
    DB.apiKey = $("sK").value.trim();
    closeSheet(); await save(); toast("保存しました");
  };
  $("sCsv").onclick = exportCsv;
  $("sJson").onclick = exportJson;
  $("sImp").onclick = () => $("sFile").click();
  $("sFile").onchange = async ev => {
    const f = ev.target.files[0]; if (!f) return;
    try {
      const d = JSON.parse(await f.text());
      if (!Array.isArray(d.entries)) throw new Error();
      const have = new Set(DB.entries.map(x => x.id));
      d.entries.forEach(x => { if (!have.has(x.id)) DB.entries.push(x); });
      if (d.budget) DB.budget = d.budget;
      closeSheet(); await save(); toast("読み込みました");
    } catch(e){ toast("このファイルは読めませんでした"); }
  };
  $("sClr").onclick = async () => {
    if (!confirm("すべての記録を消します。元に戻せません。")) return;
    DB.entries = []; closeSheet(); await save(); toast("消しました");
  };
};

function dl(name, text, mime){
  const b = new Blob([text], { type: mime });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function exportCsv(){
  const rows = [["日付","種類","分類","金額","メモ"]].concat(
    DB.entries.slice().sort((a,b) => a.date < b.date ? -1 : 1).map(e => [
      e.date, e.type === "inc" ? "収入" : "支出",
      (CATMAP[e.cat] || {name:"その他"}).name, e.amount, (e.memo || "").replace(/"/g, '""')
    ])
  );
  const csv = "\uFEFF" + rows.map(r => r.map(v => `"${v}"`).join(",")).join("\r\n");
  dl("kakeibo-" + todayStr() + ".csv", csv, "text/csv");
}
function exportJson(){ dl("kakeibo-backup-" + todayStr() + ".json", JSON.stringify(DB), "application/json"); }

/* ========== タブ・月送り ========== */
document.querySelector(".tabs").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  view = b.dataset.v;
  document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-pressed", x.dataset.v === view));
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === "v-" + view));
  const el = $("v-" + view); if (el) el.scrollTop = 0;
  renderAll();
});
$("prevM").onclick = () => { cur.setMonth(cur.getMonth() - 1); renderAll(); };
$("nextM").onclick = () => { cur.setMonth(cur.getMonth() + 1); renderAll(); };

/* ========== 全体描画 ========== */
function renderAll(){
  $("monthLbl").textContent = cur.getFullYear() + "年" + (cur.getMonth() + 1) + "月";
  const list = ofMonth(curKey());
  $("topSum").textContent = yen(sumBy(list, "exp"));
  $("topLbl").textContent = (cur.getMonth() + 1) + "月の支出";
  if (view === "list") renderList();
  if (view === "chart") renderChart();
}

/* ========== 起動 ========== */
(async function init(){
  const d = await store.get();
  if (d) DB = Object.assign(DB, d);
  input.cat = DB.lastCat || "food";
  syncSeg(); renderDateRow(); renderAmt(); renderAll();
})();
</script>
